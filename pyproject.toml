[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wrc-pipeline"
version = "0.1.0"
description = "Partitioned Scrapy pipeline for Irish Workplace Relations decisions"
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.12,<3.0",
    "pymongo>=4.8,<5.0",
    "boto3>=1.34,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.2",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "dagster>=1.8,<2.0",
    "dagster-webserver>=1.8,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true

# Lets `dagster dev` find the code location with no arguments, instead of
# requiring `-m wrc_pipeline.orchestration.definitions` every time.
[tool.dagster]
module_name = "wrc_pipeline.orchestration.definitions"
code_location_name = "wrc_pipeline"
