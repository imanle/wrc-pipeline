
mongo:
  uri: "${MONGO_URI:-mongodb://wrc:wrc_password@localhost:27017/?authSource=admin}"
  database: "${MONGO_DATABASE:-wrc}"
  landing_collection: "documents_landing"
  curated_collection: "documents_curated"
  runs_collection: "pipeline_runs"
  failures_collection: "pipeline_failures"
  server_selection_timeout_ms: 5000

s3:
  endpoint_url: "${S3_ENDPOINT_URL:-http://localhost:9000}"
  access_key: "${S3_ACCESS_KEY:-minioadmin}"
  secret_key: "${S3_SECRET_KEY:-minioadmin}"
  region: "${S3_REGION:-us-east-1}"
  landing_bucket: "${S3_LANDING_BUCKET:-wrc-landing}"
  curated_bucket: "${S3_CURATED_BUCKET:-wrc-curated}"
  # Key template for the landing zone. The hash suffix is what makes the zone
  # append-only: a changed document lands beside its predecessor, never over it.
  landing_key_template: "{body_slug}/{partition_key}/{identifier}__{hash_prefix}{ext}"
  # Curated keys are canonical per the brief: identifier.ext, nothing else.
  curated_key_template: "{body_slug}/{identifier}{ext}"
  hash_prefix_length: ${S3_HASH_PREFIX_LENGTH:-8}
  hash_chunk_bytes: ${S3_HASH_CHUNK_BYTES:-65536}
  max_attempts: ${S3_MAX_ATTEMPTS:-5}

partitions:
  # daily | weekly | monthly | quarterly | yearly
  #
  # WEEKLY, chosen empirically rather than a priori.
  size: "${PARTITION_SIZE:-weekly}"
  start_date: "${RUN_START_DATE:-2024-01-01}"
  end_date: "${RUN_END_DATE:-2025-01-01}"

scraping:
  base_url: "https://www.workplacerelations.ie"
  #
  # Contract:
  #   /en/search/?decisions=1&from=<d/M/yyyy>&to=<d/M/yyyy>&body=<id>[&q=<kw>]
  search_path: "${SEARCH_PATH:-/en/search/}"
  # Constant flag scoping the search to the decisions database.
  decisions_flag: 1
  date_display_format: "%d/%m/%Y"

  listing:
    record: "li.each-item"
    identifier: "h2.title::attr(title)"
    identifier_crosscheck: "span.refNO::text"
    published_date: "span.date::text"
    description: "p.description::attr(title)"
    document_link: "div.link a::attr(href)"
    document_link_fallback: "p.fullpath::attr(title)"

  # CRITICAL: always follow the site's own href. NEVER rebuild a document URL
  # from the identifier. 
  document_extensions:
    html: [".html", ".htm", ".aspx"]
    binary: [".pdf", ".doc", ".docx", ".rtf"]

  document_pdf_link: "${DOCUMENT_PDF_LINK:-div.col-sm-9 a[href$='.pdf']}"

  # Confirmed: &pageNumber=2 (1-based; omitted entirely for page 1).
  page_param: "${SEARCH_PAGE_PARAM:-pageNumber}"

  page_size: 10
  # Regex over "Shows 1 to 10 of 234 results". Group 3 is the reconciliation
  # baseline for records_found (requirement 10).
  result_count_pattern: "Shows\\s+(\\d+)\\s+to\\s+(\\d+)\\s+of\\s+([\\d,]+)\\s+results"
  no_results_pattern: "There are no search results"
  max_pages_per_partition: ${MAX_PAGES_PER_PARTITION:-500}
  user_agent: "${SCRAPY_USER_AGENT:-wrc-research-crawler/1.0 (+contact: you@example.com)}"
  concurrent_requests: ${SCRAPY_CONCURRENT_REQUESTS:-16}
  concurrent_requests_per_domain: ${SCRAPY_CONCURRENT_PER_DOMAIN:-8}
  download_delay: ${SCRAPY_DOWNLOAD_DELAY:-0.25}
  download_timeout: ${SCRAPY_DOWNLOAD_TIMEOUT:-45}
  autothrottle_enabled: ${SCRAPY_AUTOTHROTTLE_ENABLED:-true}
  autothrottle_start_delay: 0.5
  autothrottle_max_delay: 30.0
  autothrottle_target_concurrency: ${SCRAPY_AUTOTHROTTLE_TARGET_CONCURRENCY:-4.0}
  retry_times: ${SCRAPY_RETRY_TIMES:-4}
  retry_http_codes: [429, 500, 502, 503, 504, 408, 522, 524]
  robotstxt_obey: false  # Documented decision; see ARCHITECTURE.md.

  bodies:
    - name: "Workplace Relations Commission"
      slug: "wrc"
      value: "15376"
      earliest_date: "2015-10-01"
      identifier_pattern: "(?i)^(?=[A-Z0-9\\s,/.-]*[A-Z])(?=[A-Z0-9\\s,/.-]*[0-9])[A-Z0-9][A-Z0-9\\s,/.-]*$"

    - name: "Labour Court"
      slug: "labour-court"
      value: "3"
      earliest_date: "1986-10-01"
      identifier_pattern: "(?i)^(?=[A-Z0-9\\s,/.-]*[A-Z])(?=[A-Z0-9\\s,/.-]*[0-9])[A-Z0-9][A-Z0-9\\s,/.-]*$"

    - name: "Equality Tribunal"
      slug: "equality-tribunal"
      value: "1"
      earliest_date: "1996-01-01"
      identifier_pattern: "(?i)^(?=[A-Z0-9\\s,/.-]*[A-Z])(?=[A-Z0-9\\s,/.-]*[0-9])[A-Z0-9][A-Z0-9\\s,/.-]*$"

    - name: "Employment Appeals Tribunal"
      slug: "employment-appeals-tribunal"
      value: "2"
      earliest_date: "2007-01-01"
      identifier_pattern: "(?i)^(?=[A-Z0-9\\s,/.-]*[A-Z])(?=[A-Z0-9\\s,/.-]*[0-9])[A-Z0-9][A-Z0-9\\s,/.-]*$"

      crosscheck_identifier: false

  volatile_content_patterns:
    - "<!--\\s*Elapsed time:[^>]*-->"

  identifier_strip_patterns:
    - "\\s*-\\s*Full Case Report\\s*$"
  identifier_unsafe_chars: "/\\\\:*?\"<>| ,"
  identifier_replacement: "-"

transform:
  content_selectors:
    - "div.content"
    - "div.col-sm-9"
    - "main"
    - "article"

  title_selector: "h1.page-title"

  strip_selectors:
    - "script"
    - "style"
    - "noscript"
    - "iframe"
    - "form"
    - "img[src*='signature_logo']"
    - "img[src*='ecblank']"
    - "img[width='1'][height='1']"


  preserve_selectors:
    - "table"
    - "div.table-responsive"

  drop_empty_elements: true
  normalise_whitespace: true
  min_content_chars: 200

logging:
  level: "${LOG_LEVEL:-INFO}"
  file: "${LOG_FILE:-logs/pipeline.jsonl}"
  console: true